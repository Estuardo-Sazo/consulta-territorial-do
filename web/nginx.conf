# nginx sirve la web compilada y reenvía /api/ al contenedor de la API.
# Así el navegador habla con un solo origen (sin CORS) y la API no se publica
# directamente fuera de Docker.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Comprime JSON y GeoJSON: el mapa de municipios baja de ~0.6 MB a ~0.2 MB.
    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # "api" es el nombre del servicio en docker-compose.yml.
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Archivos de Vite con hash en el nombre: se pueden guardar un año.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # La navegación es por hash (#/ficha/...), así que basta con index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
