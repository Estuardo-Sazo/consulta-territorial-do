# Por ahora solo la base de datos. Uso: docker compose up -d db

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PUERTO_DB:-5432}:5432" # solo accesible desde esta máquina
    volumes:
      - datos_postgres:/var/lib/postgresql/data # los datos persisten
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_postgres:
